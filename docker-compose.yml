services:
  webapp:
    build: .
    container_name: school-webapp
    restart: unless-stopped
    networks:
      - web

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webapp
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config: